<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ครัวพอใจตามสั่ง</title>
<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ── Reset & Base ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--green:#22c55e;--red:#ef4444;
  --orange:#f59e0b;--gray:#64748b;--bg:#f8fafc;--card:#ffffff;
  --text:#1e293b;--text2:#64748b;--border:#e2e8f0;
}
body{font-family:'Sarabun','Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:90px;}
img{display:block;max-width:100%;}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:999;gap:16px;}
#loading .spin{width:44px;height:44px;border:4px solid #e2e8f0;
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Header ── */
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));
  padding:16px 16px 20px;color:#fff;position:sticky;top:0;z-index:50;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.brand{font-size:18px;font-weight:700;}
.header-sub{font-size:12px;opacity:.8;}
.user-name{font-size:11px;background:#ffffff22;padding:4px 10px;border-radius:20px;}

/* ── Search & Categories ── */
.sticky-bar{position:sticky;top:72px;z-index:40;background:var(--bg);
  padding:10px 14px 0;border-bottom:1px solid var(--border);}
.search-wrap{position:relative;margin-bottom:10px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text2);font-size:15px;}
.search-input{width:100%;background:#fff;border:1.5px solid var(--border);
  border-radius:22px;padding:9px 14px 9px 36px;font-size:14px;
  font-family:inherit;outline:none;color:var(--text);}
.search-input:focus{border-color:var(--blue);}

.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;}
.cats::-webkit-scrollbar{height:0;}
.cat{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text2);background:#fff;cursor:pointer;
  font-family:inherit;}
.cat.on{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ── Menu Grid ── */
.section-title{padding:14px 14px 6px;font-size:13px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.5px;}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px;}

.menu-card{background:var(--card);border-radius:14px;overflow:hidden;
  border:1.5px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s;
  position:relative;}
.menu-card:active{transform:scale(0.97);}
.menu-card.sold{opacity:.55;cursor:default;}

.menu-emoji-wrap{width:100%;height:110px;display:flex;align-items:center;
  justify-content:center;font-size:50px;background:#f8fafc;}
.menu-img{width:100%;height:110px;object-fit:cover;display:block;}
.menu-info{padding:8px 10px 10px;}
.menu-name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px;}
.menu-price{font-size:15px;font-weight:700;color:var(--blue);}
.menu-price small{font-size:10px;color:var(--text2);font-weight:400;margin-left:2px;}

.stock-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;
  border-radius:50%;border:2px solid #fff;}
.stock-dot.in{background:var(--green);}
.stock-dot.out{background:var(--red);}
.sold-badge{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:var(--red);
  background:#ffffff99;}

/* ── Floating Cart ── */
.cart-bar{position:fixed;bottom:0;left:0;right:0;z-index:60;
  padding:12px 16px;transform:translateY(100%);transition:transform .3s;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  box-shadow:0 -4px 20px #2563eb33;}
.cart-bar.show{transform:translateY(0);}
.cart-inner{display:flex;align-items:center;justify-content:space-between;
  max-width:480px;margin:0 auto;}
.cart-meta{display:flex;flex-direction:column;}
.cart-cnt{font-size:11px;color:#ffffffaa;}
.cart-sum{font-size:19px;font-weight:700;color:#fff;}
.btn-cart{background:#fff;color:var(--blue);border:none;border-radius:12px;
  padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;}

/* ── Modals ── */
.overlay{position:fixed;inset:0;background:#00000077;z-index:70;
  display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px 20px 32px;max-height:90vh;overflow-y:auto;
  animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:40px;height:4px;background:#e2e8f0;border-radius:2px;
  margin:0 auto 16px;}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.sheet-sub{font-size:12px;color:var(--text2);margin-bottom:16px;}

/* Add-on chips */
.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.addon-chip{border:1.5px solid var(--border);border-radius:12px;padding:10px;
  text-align:center;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s;font-family:inherit;}
.addon-chip.on{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
.addon-chip .ap{font-size:11px;color:var(--orange);margin-top:2px;font-weight:700;}

.qty-row{display:flex;align-items:center;justify-content:space-between;
  border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;
  margin-bottom:16px;}
.qty-ctrl{display:flex;align-items:center;gap:12px;}
.q-btn{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);
  background:#f8fafc;font-size:18px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  font-family:inherit;}
.q-btn:active{background:var(--border);}
.q-num{font-size:18px;font-weight:700;min-width:28px;text-align:center;}
.q-price{font-size:16px;font-weight:700;color:var(--blue);}

.btn-add{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-add:active{background:var(--blue2);}

/* Cart modal */
.cart-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--border);}
.ci-emoji{font-size:26px;flex-shrink:0;}
.ci-body{flex:1;}
.ci-name{font-size:14px;font-weight:600;}
.ci-addon{font-size:11px;color:var(--orange);margin-top:1px;}
.ci-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
.ci-q{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);
  background:#f8fafc;font-size:15px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;}
.ci-qn{font-size:13px;font-weight:700;min-width:18px;text-align:center;}
.ci-price{font-size:14px;font-weight:700;color:var(--blue);}

/* Delivery */
.del-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.del-opt{border:1.5px solid var(--border);border-radius:12px;padding:12px;
  text-align:center;cursor:pointer;font-size:13px;font-weight:600;}
.del-opt.on{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
.del-opt .di{font-size:24px;display:block;margin-bottom:4px;}

.note-area{width:100%;border:1.5px solid var(--border);border-radius:12px;
  padding:10px 12px;font-size:13px;font-family:inherit;resize:none;
  margin-bottom:12px;outline:none;}
.note-area:focus{border-color:var(--blue);}
.addr-input{width:100%;border:1.5px solid var(--border);border-radius:12px;
  padding:10px 12px;font-size:13px;font-family:inherit;margin-bottom:10px;outline:none;}
.addr-input:focus{border-color:var(--blue);}

.total-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-top:1.5px solid var(--border);margin:4px 0 14px;}
.total-lbl{font-size:13px;color:var(--text2);}
.total-val{font-size:22px;font-weight:800;color:var(--text);}

.btn-order{width:100%;padding:16px;background:var(--blue);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px #2563eb44;}
.btn-order:active{background:var(--blue2);}
.btn-close{width:100%;padding:12px;background:#f1f5f9;color:var(--text2);border:none;
  border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  margin-top:8px;}

/* Success */
.success-wrap{text-align:center;padding:20px 0;}
.success-icon{font-size:72px;margin-bottom:12px;}
.success-num{font-size:28px;font-weight:800;color:var(--blue);margin:8px 0;}
.success-sub{font-size:14px;color:var(--text2);line-height:1.6;}

/* Toast */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:80;opacity:0;transition:all .25s;
  white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spin"></div>
  <div style="font-size:14px;color:#64748b;">กำลังโหลด...</div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="brand">🍳 ครัวพอใจตามสั่ง</div>
      <div class="header-sub">สั่งง่าย รับเร็ว ส่งฟรีในชุมชน</div>
    </div>
    <div class="user-name" id="user-greeting">กำลังโหลด...</div>
  </div>
</div>

<!-- Sticky search + cats -->
<div class="sticky-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" placeholder="ค้นหาเมนู..." oninput="filterMenu()">
  </div>
  <div class="cats" id="cats">
    <button class="cat on" onclick="setCat('all',this)">🍽 ทั้งหมด</button>
    <button class="cat" onclick="setCat('ผัด',this)">🥘 ผัด</button>
    <button class="cat" onclick="setCat('ข้าว',this)">🍛 ข้าว</button>
    <button class="cat" onclick="setCat('ก๋วยเตี๋ยว',this)">🍜 เส้น</button>
    <button class="cat" onclick="setCat('ต้ม/แกง',this)">🍲 ต้ม/แกง</button>
    <button class="cat" onclick="setCat('เครื่องดื่ม',this)">🧋 เครื่องดื่ม</button>
  </div>
</div>

<!-- Menu -->
<div class="section-title" id="menu-section-title">เมนูทั้งหมด</div>
<div class="menu-grid" id="menu-grid"></div>

<!-- Cart Bar -->
<div class="cart-bar" id="cart-bar">
  <div class="cart-inner">
    <div class="cart-meta">
      <div class="cart-cnt" id="cart-cnt">0 รายการ</div>
      <div class="cart-sum" id="cart-sum">฿0</div>
    </div>
    <button class="btn-cart" onclick="openCart()">🛒 ดูตะกร้า →</button>
  </div>
</div>

<!-- Add-on Sheet -->
<div class="overlay" id="addon-overlay" onclick="handleOverlayClick(event,'addon-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="addon-title">เลือก Add-ons</div>
    <div class="sheet-sub">เลือกได้หลายอย่าง</div>
    <div class="addon-grid" id="addon-grid"></div>
    <div class="qty-row">
      <span style="font-size:14px;font-weight:600;">จำนวน</span>
      <div class="qty-ctrl">
        <button class="q-btn" onclick="changeQty(-1)">−</button>
        <span class="q-num" id="addon-qty">1</span>
        <button class="q-btn" onclick="changeQty(1)">+</button>
      </div>
      <span class="q-price" id="addon-price">฿0</span>
    </div>
    <button class="btn-add" onclick="addToCart()">➕ เพิ่มลงตะกร้า</button>
  </div>
</div>

<!-- Cart Sheet -->
<div class="overlay" id="cart-overlay" onclick="handleOverlayClick(event,'cart-overlay')">
  <div class="sheet" style="max-height:85vh;">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🛒 ตะกร้าสินค้า</div>
    <div id="cart-list"></div>

    <div class="del-opts">
      <div class="del-opt on" id="del-pickup" onclick="selDel('pickup')">
        <span class="di">🏪</span>รับหน้าร้าน
      </div>
      <div class="del-opt" id="del-deliver" onclick="selDel('deliver')">
        <span class="di">🛵</span>ส่งฟรีในชุมชน
      </div>
    </div>

    <div id="addr-wrap" style="display:none;">
      <input class="addr-input" id="addr-input" placeholder="📍 จุดสังเกต / ชื่อบ้านคนคุ้นเคย...">
    </div>
    <textarea class="note-area" id="note-area" placeholder="📝 โน้ต เช่น ไม่เผ็ด / ไม่ใส่ผัก..." rows="2"></textarea>

    <div class="total-row">
      <div class="total-lbl">ยอดรวม</div>
      <div class="total-val" id="cart-total-val">฿0</div>
    </div>
    <button class="btn-order" id="btn-order" onclick="placeOrder()">📱 ยืนยันออเดอร์</button>
    <button class="btn-close" onclick="closeOverlay('cart-overlay')">ปิด</button>
  </div>
</div>

<!-- Success Sheet -->
<div class="overlay" id="success-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="success-wrap">
      <div class="success-icon">✅</div>
      <div style="font-size:18px;font-weight:700;">ส่งออเดอร์แล้ว!</div>
      <div class="success-num" id="success-num">#000</div>
      <div class="success-sub">ครัวได้รับออเดอร์ของคุณแล้ว<br>รอรับอาหารได้เลยนะครับ 😊<br><br>
        <strong>เวลาประมาณ 15–20 นาที</strong></div>
    </div>
    <button class="btn-order" onclick="closeOverlay('success-overlay')" style="margin-top:16px;">
      กลับหน้าเมนู
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  🔧 ตั้งค่า — แก้ 2 บรรทัดนี้
// ══════════════════════════════════════════
const LIFF_ID        = '2010064453-INzMvaZ2';            // ครัวพอใจ สั่งอาหาร — LINE Login channel
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-_hcz2P3IXtrJdmph_MdodAY-AIym34bV9isYtgTJIq3f3VHi2z4-3l0A5yRq-21SFg/exec';
// ══════════════════════════════════════════

const EMOJI_MAP = {
  'ผัด':'🥘','ข้าว':'🍛','ก๋วยเตี๋ยว':'🍜','ต้ม/แกง':'🍲','เครื่องดื่ม':'🧋'
};
// ราคา add-on ตามชื่อ — ตรงกับตาราง Add-ons ใน Sheet
const ADDON_PRICES = {
  'พิเศษ':10,       // ADD-01
  'ไข่ดาว':10,      // ADD-02
  'เพิ่มไข่ดาว':10, // ชื่อสำรอง
  'ไข่ขัน':10,      // ADD-03
  'ไข่เจียว':10,    // ADD-04
  'เพิ่มเส้น':10,   // ADD-05
  'เส้นพิเศษ':10,   // ชื่อสำรอง
  'ตีนไก่':5,       // ADD-06
  'หมูสับ':10,      // ADD-07
  'พิเศษ+':50,      // ADD-08
  'ไม่เผ็ด':0,      // ADD-09
  'ไม่ใส่ผัก':0,    // ADD-10
  'ไม่ใส่ผักชี':0,  // ชื่อสำรอง
};

let menuItems    = [];
let cart         = [];
let currentCat   = 'all';
let pendingItem  = null;
let selAddons    = [];
let addonQty     = 1;
let deliveryType = 'pickup';
let userProfile  = null;

// ── Init LIFF ──
async function initApp() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      userProfile = await liff.getProfile();
      document.getElementById('user-greeting').textContent = '👋 ' + (userProfile.displayName || 'ลูกค้า');
    } else {
      liff.login();
      return;
    }
  } catch (e) {
    // LIFF init failed — run in standalone mode (for testing outside LINE)
    console.warn('LIFF not available, running standalone:', e.message);
    document.getElementById('user-greeting').textContent = '👋 ทดสอบ';
  }
  await loadMenu();
  document.getElementById('loading').style.display = 'none';
}

// ── Load Menu from Apps Script ──
async function loadMenu() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=menu');
    const data = await res.json();
    if (data.status === 'success') {
      menuItems = data.items;
    }
  } catch(e) {
    // Fallback: hardcoded menu (ใช้ตอนทดสอบ offline)
    menuItems = FALLBACK_MENU;
  }
  renderMenu();
}

// ── Render Menu ──
function renderMenu(search = '') {
  const grid = document.getElementById('menu-grid');
  const filtered = menuItems.filter(m => {
    const catOk  = currentCat === 'all' || m.category === currentCat;
    const srchOk = !search || m.name.includes(search);
    return catOk && srchOk;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;">ไม่พบเมนูที่ค้นหา</div>';
    return;
  }

  grid.innerHTML = filtered.map(m => {
    const emoji   = EMOJI_MAP[m.category] || '🍽';
    const inStock = m.status === 'มี';
    // แสดงรูปจาก URL ถ้ามี ไม่งั้นใช้ emoji
    const imgHtml = m.image
      ? `<img class="menu-img" src="${m.image}" alt="${m.name}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        + `<div class="menu-emoji-wrap" style="display:none">${emoji}</div>`
      : `<div class="menu-emoji-wrap">${emoji}</div>`;
    return `
      <div class="menu-card ${inStock?'':'sold'}" onclick="${inStock?`openAddon('${m.id}')`:``}">
        ${imgHtml}
        <div class="stock-dot ${inStock?'in':'out'}"></div>
        ${!inStock?'<div class="sold-badge">❌ หมด</div>':''}
        <div class="menu-info">
          <div class="menu-name">${m.name}</div>
          <div class="menu-price">฿${m.price} <small>/จาน</small></div>
        </div>
      </div>`;
  }).join('');
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderMenu(document.getElementById('search').value);
}
function filterMenu() { renderMenu(document.getElementById('search').value); }

// ── Add-on Modal ──
function openAddon(id) {
  pendingItem = menuItems.find(m => m.id === id);
  if (!pendingItem) return;
  selAddons = [];
  addonQty  = 1;
  document.getElementById('addon-title').textContent = pendingItem.name;

  const addonsForItem = pendingItem.addons || [];
  const grid = document.getElementById('addon-grid');
  if (addonsForItem.length === 0) {
    grid.innerHTML = '<div style="color:#94a3b8;font-size:13px;text-align:center;grid-column:1/-1;">ไม่มี Add-ons</div>';
  } else {
    // แสดงทุก add-on จาก Sheet ตรงๆ ไม่ต้อง filter จาก hardcoded list
    grid.innerHTML = addonsForItem.map((name, i) => {
      const price = ADDON_PRICES[name] !== undefined ? ADDON_PRICES[name] : 0;
      const uid   = 'ao_' + i;
      return `<div class="addon-chip" id="ac-${uid}" onclick="toggleAddon('${uid}','${name}',${price})">
        ${name}
        <div class="ap">${price > 0 ? '+฿'+price : 'ฟรี'}</div>
      </div>`;
    }).join('');
  }
  updateAddonPrice();
  document.getElementById('addon-overlay').classList.add('show');
}

function toggleAddon(id, name, price) {
  const idx = selAddons.findIndex(a => a.id === id);
  const el  = document.getElementById('ac-'+id);
  if (idx >= 0) { selAddons.splice(idx, 1); el.classList.remove('on'); }
  else           { selAddons.push({id,name,price}); el.classList.add('on'); }
  updateAddonPrice();
}

function changeQty(d) {
  addonQty = Math.max(1, addonQty + d);
  document.getElementById('addon-qty').textContent = addonQty;
  updateAddonPrice();
}

function updateAddonPrice() {
  const base  = pendingItem ? pendingItem.price : 0;
  const extra = selAddons.reduce((s, a) => s + a.price, 0);
  document.getElementById('addon-price').textContent = '฿' + (base + extra) * addonQty;
}

function addToCart() {
  if (!pendingItem) return;
  const extra  = selAddons.reduce((s, a) => s + a.price, 0);
  const price  = pendingItem.price + extra;
  const addonText = selAddons.map(a => a.name).join(', ');
  const key    = pendingItem.id + '-' + addonText;
  const exist  = cart.find(c => c.key === key);
  if (exist) { exist.qty += addonQty; }
  else { cart.push({ key, id: pendingItem.id, name: pendingItem.name,
    emoji: EMOJI_MAP[pendingItem.category]||'🍽', addon: addonText, price, qty: addonQty }); }
  closeOverlay('addon-overlay');
  updateCartBar();
  toast('➕ เพิ่ม ' + pendingItem.name + ' แล้ว');
}

// ── Cart ──
function updateCartBar() {
  const bar = document.getElementById('cart-bar');
  if (cart.length === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const count = cart.reduce((s, c) => s + c.qty, 0);
  document.getElementById('cart-cnt').textContent = count + ' รายการ';
  document.getElementById('cart-sum').textContent = '฿' + total;
}

function openCart() {
  renderCart();
  document.getElementById('cart-overlay').classList.add('show');
}

function renderCart() {
  const list = document.getElementById('cart-list');
  if (cart.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;">ตะกร้าว่างเปล่า</div>';
  } else {
    list.innerHTML = cart.map(c => `
      <div class="cart-item">
        <div class="ci-emoji">${c.emoji}</div>
        <div class="ci-body">
          <div class="ci-name">${c.name}</div>
          ${c.addon?`<div class="ci-addon">+ ${c.addon}</div>`:''}
          <div class="ci-ctrl">
            <button class="ci-q" onclick="cqty('${c.key}',-1)">−</button>
            <span class="ci-qn">${c.qty}</span>
            <button class="ci-q" onclick="cqty('${c.key}',1)">+</button>
          </div>
        </div>
        <div class="ci-price">฿${c.price * c.qty}</div>
      </div>`).join('');
  }
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  document.getElementById('cart-total-val').textContent = '฿' + total;
}

function cqty(key, d) {
  const i = cart.findIndex(c => c.key === key);
  if (i < 0) return;
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  renderCart();
  updateCartBar();
}

function selDel(type) {
  deliveryType = type;
  document.getElementById('del-pickup').classList.toggle('on',  type === 'pickup');
  document.getElementById('del-deliver').classList.toggle('on', type === 'deliver');
  document.getElementById('addr-wrap').style.display = type === 'deliver' ? 'block' : 'none';
}

// ── Place Order ──
async function placeOrder() {
  if (cart.length === 0) { toast('⚠️ ยังไม่มีสินค้าในตะกร้า'); return; }
  const btn = document.getElementById('btn-order');
  btn.disabled = true;
  btn.textContent = '⏳ กำลังส่ง...';

  const payload = {
    action:        'submitOrder',
    items:         cart,
    deliveryType,
    address:       document.getElementById('addr-input').value,
    note:          document.getElementById('note-area').value,
    customerName:  userProfile ? userProfile.displayName : 'ลูกค้า LINE',
    userId:        userProfile ? userProfile.userId : '',
  };

  try {
    const res  = await fetch(APPS_SCRIPT_URL, {
      method:   'POST',
      headers:  { 'Content-Type': 'text/plain' },  // ป้องกัน CORS preflight กับ Apps Script
      body:     JSON.stringify(payload),
      redirect: 'follow',
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if (data.status === 'success') {
      document.getElementById('success-num').textContent = data.orderNum;
      closeOverlay('cart-overlay');
      document.getElementById('success-overlay').classList.add('show');
      cart = [];
      updateCartBar();
    } else {
      toast('❌ เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
  } catch(e) {
    toast('❌ ไม่สามารถส่งออเดอร์ได้ กรุณาลองใหม่');
  } finally {
    btn.disabled = false;
    btn.textContent = '📱 ยืนยันออเดอร์';
  }
}

// ── Helpers ──
function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
function handleOverlayClick(e, id) { if (e.target.classList.contains('overlay')) closeOverlay(id); }

let _toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
