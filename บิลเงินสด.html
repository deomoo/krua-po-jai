<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บิลเงินสด — ครัวพอใจตามสั่ง</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'TH Sarabun New', 'Sarabun', 'Angsana New', serif;
  font-size: 16px;
  background: #f0f0f0;
  padding: 20px;
}

.no-print {
  background: white;
  border-radius: 10px;
  padding: 12px 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  width: 148mm;
  margin-left: auto;
  margin-right: auto;
}

.btn {
  padding: 8px 22px;
  font-size: 15px;
  font-family: inherit;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.btn-print { background: #1565c0; color: white; }
.btn-print:hover { background: #0d47a1; }

/* ── Receipt Page ── */
.receipt {
  background: white;
  width: 148mm;
  min-height: 200mm;
  margin: 0 auto;
  padding: 10mm 12mm 12mm;
  box-shadow: 0 0 10px rgba(0,0,0,0.15);
  position: relative;
}

.receipt-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 4px;
  text-decoration: underline;
}

.shop-name {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 2px;
}

.shop-info {
  text-align: center;
  font-size: 14px;
  color: #444;
  margin-bottom: 8px;
  line-height: 1.5;
}

.divider {
  border: none;
  border-top: 1px solid #333;
  margin: 6px 0;
}
.divider-double {
  border: none;
  border-top: 3px double #333;
  margin: 6px 0;
}

.meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 15px;
  margin: 3px 0;
}

.payer-row {
  font-size: 15px;
  margin: 4px 0;
  display: flex;
  gap: 6px;
  align-items: baseline;
}
.payer-label { white-space: nowrap; font-weight: bold; }
.payer-input {
  border: none;
  border-bottom: 1px dotted #555;
  outline: none;
  font-family: inherit;
  font-size: 15px;
  flex: 1;
  background: transparent;
}

/* Items table */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  margin: 8px 0;
}
thead th {
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
  padding: 4px 6px;
  text-align: center;
  font-weight: bold;
}
tbody td {
  padding: 3px 6px;
  vertical-align: top;
}
.col-num  { width: 8%;  text-align: center; }
.col-item { width: 52%; text-align: left; }
.col-qty  { width: 10%; text-align: center; }
.col-price{ width: 15%; text-align: right; }
.col-total{ width: 15%; text-align: right; }

tfoot td {
  padding: 3px 6px;
  font-weight: bold;
  font-size: 16px;
}

/* Signature area */
.sign-area {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  font-size: 14px;
}
.sign-box { text-align: center; width: 45%; }
.sign-line {
  border-bottom: 1px solid #333;
  height: 32px;
  margin-bottom: 4px;
  width: 100%;
}

/* Tax ID row */
.tax-row {
  font-size: 14px;
  color: #555;
  margin: 2px 0;
}
[contenteditable="true"] { outline: none; cursor: text; }
[contenteditable="true"]:focus { background: #fffde7; }

/* Loading */
#loading { text-align: center; padding: 30px; color: #888; font-size: 16px; }

@media print {
  body { background: white; padding: 0; }
  .no-print { display: none !important; }
  .receipt { box-shadow: none; padding: 8mm 10mm 10mm; width: 100%; }
  @page { size: A5; margin: 0; }
}
</style>
</head>
<body>

<div class="no-print">
  <span style="font-size:14px; font-weight:bold; white-space:nowrap;">ประเภทเอกสาร:</span>
  <select id="doc-type" onchange="changeDocType()" style="font-family:inherit;font-size:14px;padding:5px 10px;border:1px solid #ccc;border-radius:6px;">
    <option value="บิลเงินสด">บิลเงินสด</option>
    <option value="ใบเสร็จรับเงิน">ใบเสร็จรับเงิน</option>
    <option value="ใบสำคัญรับเงิน">ใบสำคัญรับเงิน</option>
  </select>
  <button class="btn btn-print" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button>
  <span id="bill-status" style="font-size:14px; color:#666;">กำลังโหลดข้อมูล...</span>
</div>

<div class="receipt" id="receipt">
  <div id="loading">⏳ กำลังโหลดข้อมูลออเดอร์...</div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxiA0NpUnLVhp7IK9PLPrK3V0XL1l4ZLOka8DcuS0VkLuIpgMyWGTmfRlSrH_o8Q1TS4A/exec';

const SHOP = {
  name:    'ครัวพอใจตามสั่ง',
  address: '111/2 หมู่ 5 ตำบลนาแห้ว อำเภอนาแห้ว จังหวัดเลย 42170',
  phone:   'โทร. 093 721 0449',
  taxId:   'เลขผู้เสียภาษี (แก้ไขได้)',
};

const MONTH_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fmt = n => Number(n).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});

function formatDateTH(str) {
  if (!str) return '';
  const [d,m,y] = str.split('/');
  const be = parseInt(y) + 543;
  return `${parseInt(d)} ${MONTH_TH[parseInt(m)]} ${be}`;
}

function parseItems(itemsStr) {
  // รูปแบบ: "กะเพราหมู x1, ข้าวผัด x2 [฿50]" หรือ "เมนู x1 [฿60]"
  const parts = itemsStr.split(',').map(s => s.trim()).filter(Boolean);
  return parts.map(p => {
    // หาราคา [฿XX]
    const priceMatch = p.match(/\[฿([\d,]+)\]/);
    const price = priceMatch ? parseFloat(priceMatch[1].replace(',','')) : null;
    // หา qty
    const qtyMatch = p.match(/x(\d+)/i);
    const qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;
    // ชื่อเมนู (ตัดส่วน qty และราคาออก)
    const name = p.replace(/\s*x\d+\s*/i,'').replace(/\s*\[฿[\d,]+\]/,'').trim();
    return { name, qty, price };
  });
}

function getBillNumber() {
  // สร้างเลขที่บิลจาก orderNum + date
  const params = new URLSearchParams(window.location.search);
  const order = params.get('order') || '';
  const date  = params.get('date')  || '';
  if (!order) return 'XXXX';
  const [d,m,y] = (date || '').split('/');
  return `${order.replace('#','')}/${y||new Date().getFullYear()}`;
}

async function loadBill() {
  const params = new URLSearchParams(window.location.search);
  const orderNum = params.get('order');
  const orderDate = params.get('date');

  if (!orderNum) {
    document.getElementById('receipt').innerHTML = '<div style="padding:30px;color:red;">ไม่พบเลขออเดอร์ กรุณาเปิดจากหน้า Admin</div>';
    document.getElementById('bill-status').textContent = 'ไม่พบข้อมูล';
    return;
  }

  try {
    const res = await fetch(API + '?action=orders');
    const data = await res.json();
    const orders = data.orders || [];
    // หาออเดอร์ที่ตรงกับ orderNum และ date
    const order = orders.find(o => o.orderNum === orderNum && (!orderDate || o.date === orderDate));
    if (!order) throw new Error(`ไม่พบออเดอร์ ${orderNum}`);

    renderBill(order);
    document.getElementById('bill-status').textContent = `ออเดอร์ ${orderNum} — ${order.customerName || ''}`;
  } catch(err) {
    document.getElementById('receipt').innerHTML = `<div style="padding:30px;color:red;">❌ ${err.message}</div>`;
    document.getElementById('bill-status').textContent = 'โหลดไม่สำเร็จ';
  }
}

function renderBill(order) {
  const items = parseItems(order.items || '');
  const defaultPrice = items.every(i => i.price !== null) ? null : (Number(order.total) || 0);

  // คำนวณราคาต่อรายการ (ถ้าไม่มีราคาใน items ให้หารเฉลี่ย)
  let rows = '';
  let computedTotal = 0;
  items.forEach((item, idx) => {
    const unitPrice = item.price !== null ? item.price : 0;
    const lineTotal = unitPrice * item.qty;
    computedTotal += lineTotal;
    rows += `<tr>
      <td class="col-num">${idx+1}</td>
      <td class="col-item">${item.name}</td>
      <td class="col-qty">${item.qty}</td>
      <td class="col-price">${unitPrice > 0 ? fmt(unitPrice) : '-'}</td>
      <td class="col-total">${lineTotal > 0 ? fmt(lineTotal) : '-'}</td>
    </tr>`;
  });

  const grandTotal = Number(order.total) || computedTotal;
  const billNo = getBillNumber();
  const dateStr = formatDateTH(order.date);

  document.getElementById('receipt').innerHTML = `
    <div class="receipt-title" id="doc-title">บิลเงินสด</div>
    <div class="shop-name" contenteditable="true">${SHOP.name}</div>
    <div class="shop-info">
      <span contenteditable="true">${SHOP.address}</span><br>
      <span contenteditable="true">${SHOP.phone}</span>
    </div>
    <div class="tax-row">เลขประจำตัวผู้เสียภาษี: <span contenteditable="true">${SHOP.taxId}</span></div>

    <hr class="divider">

    <div class="meta-row">
      <span>เลขที่ ${billNo}</span>
      <span>วันที่ ${dateStr}</span>
    </div>

    <div class="payer-row">
      <span class="payer-label">ได้รับเงินจาก</span>
      <input class="payer-input" type="text" value="${order.customerName || ''}" placeholder="ชื่อผู้ชำระเงิน / หน่วยงาน">
    </div>

    <hr class="divider">

    <table>
      <thead>
        <tr>
          <th class="col-num">ที่</th>
          <th class="col-item">รายการ</th>
          <th class="col-qty">จำนวน</th>
          <th class="col-price">ราคา/หน่วย</th>
          <th class="col-total">จำนวนเงิน</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td colspan="3" style="border-top:1px solid #333;"></td>
          <td style="border-top:1px solid #333; text-align:right;">รวมทั้งสิ้น</td>
          <td style="border-top:1px solid #333; text-align:right;">${fmt(grandTotal)}</td>
        </tr>
        <tr>
          <td colspan="3"></td>
          <td style="text-align:right; font-size:13px; color:#555;">ชำระโดย</td>
          <td style="text-align:right; font-size:13px;">${order.payment || 'เงินสด'}</td>
        </tr>
      </tfoot>
    </table>

    <hr class="divider-double">

    <div class="sign-area">
      <div class="sign-box">
        <div class="sign-line"></div>
        <div>ผู้รับเงิน</div>
        <div style="font-size:13px; color:#666; margin-top:2px;">วันที่ ........./........./..........</div>
      </div>
      <div class="sign-box">
        <div class="sign-line"></div>
        <div>ผู้จ่ายเงิน</div>
        <div style="font-size:13px; color:#666; margin-top:2px;">วันที่ ........./........./..........</div>
      </div>
    </div>

    <div style="text-align:center; margin-top:14px; font-size:13px; color:#888;">
      ขอบคุณที่ใช้บริการ ${SHOP.name}
    </div>
  `;
}

function changeDocType() {
  const val = document.getElementById('doc-type').value;
  const el = document.getElementById('doc-title');
  if (el) el.textContent = val;
}

loadBill();
</script>
</body>
</html>
