<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>จัดการออเดอร์ — ครัวพอใจ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--green2:#15803d;
  --orange:#ea580c;--red:#dc2626;--gray:#64748b;--bg:#f1f5f9;
  --card:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;
}
body{font-family:'Sarabun','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}

/* ── Header ── */
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:14px 16px;color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:17px;font-weight:700;}
.header-sub{font-size:11px;opacity:.8;margin-top:2px;}
.refresh-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;}
.refresh-btn:active{opacity:.7;}

/* ── Summary Bar ── */
.summary{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
.summary::-webkit-scrollbar{display:none;}
.sum-card{flex:0 0 auto;background:var(--card);border-radius:12px;padding:10px 14px;min-width:90px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.sum-num{font-size:22px;font-weight:800;}
.sum-label{font-size:11px;color:var(--text2);margin-top:2px;}
.sum-card.new .sum-num{color:var(--orange);}
.sum-card.doing .sum-num{color:var(--blue);}
.sum-card.done .sum-num{color:var(--green);}

/* ── Filter Tabs ── */
.filter-wrap{padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filter-wrap::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:7px 16px;border-radius:20px;font-size:13px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s;}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ── Order Cards ── */
.orders-wrap{padding:0 16px;}
.order-card{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card-header{padding:12px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.order-num{font-size:16px;font-weight:800;color:var(--blue);}
.order-time{font-size:11px;color:var(--text2);margin-top:2px;}
.status-badge{flex:0 0 auto;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-รอทำ{background:#fff7ed;color:#c2410c;}
.badge-รับออเดอร์{background:#eff6ff;color:#1d4ed8;}
.badge-กำลังทำ{background:#fef3c7;color:#b45309;}
.badge-เสร็จแล้ว{background:#f0fdf4;color:#15803d;}
.badge-ส่งแล้ว{background:#f0fdf4;color:#15803d;}
.badge-ยกเลิก{background:#fef2f2;color:#991b1b;}

.card-body{padding:0 14px 12px;}
.order-customer{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.type-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
.type-ส่ง{background:#ede9fe;color:#6d28d9;}
.type-รับหน้าร้าน{background:#ecfdf5;color:#065f46;}
.order-items{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:6px;}
.order-note{font-size:12px;color:var(--orange);margin-bottom:6px;}
.order-address{font-size:12px;color:var(--text2);margin-bottom:6px;}
.order-total{font-size:15px;font-weight:700;color:var(--blue);}

.card-actions{padding:10px 14px 14px;display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{flex:1;min-width:100px;padding:10px 8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
.action-btn:active{opacity:.7;transform:scale(.97);}
.btn-confirm{background:#dbeafe;color:#1d4ed8;}
.btn-cooking{background:#fef3c7;color:#b45309;}
.btn-done{background:#dcfce7;color:#15803d;}
.btn-deliver{background:#d1fae5;color:#065f46;}
.btn-cancel{background:#fee2e2;color:#991b1b;}

/* ── Empty State ── */
.empty{text-align:center;padding:60px 20px;color:var(--text2);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:15px;}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px;}
#loading .spin{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── Auto refresh indicator ── */
.auto-bar{background:#eff6ff;text-align:center;font-size:11px;color:var(--blue);padding:4px;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><span>กำลังโหลดออเดอร์...</span></div>
<div class="toast" id="toast"></div>

<div class="header">
  <div>
    <div class="header-title">🍽️ จัดการออเดอร์</div>
    <div class="header-sub" id="last-update">ครัวพอใจตามสั่ง</div>
  </div>
  <button class="refresh-btn" onclick="loadOrders()">🔄 รีเฟรช</button>
</div>

<div class="auto-bar" id="auto-bar">รีเฟรชอัตโนมัติทุก 30 วินาที</div>

<!-- Summary -->
<div class="summary">
  <div class="sum-card new"><div class="sum-num" id="cnt-new">0</div><div class="sum-label">รอทำ</div></div>
  <div class="sum-card doing"><div class="sum-num" id="cnt-doing">0</div><div class="sum-label">กำลังทำ</div></div>
  <div class="sum-card done"><div class="sum-num" id="cnt-done">0</div><div class="sum-label">เสร็จแล้ว</div></div>
  <div class="sum-card" style="background:#f8fafc"><div class="sum-num" id="cnt-all" style="color:#475569">0</div><div class="sum-label">ทั้งหมดวันนี้</div></div>
</div>

<!-- Filter Tabs -->
<div class="filter-wrap">
  <button class="tab active" data-filter="all" onclick="filterOrders('all',this)">ทั้งหมด</button>
  <button class="tab" data-filter="รอทำ" onclick="filterOrders('รอทำ',this)">🔴 รอทำ</button>
  <button class="tab" data-filter="รับออเดอร์" onclick="filterOrders('รับออเดอร์',this)">🔵 รับแล้ว</button>
  <button class="tab" data-filter="กำลังทำ" onclick="filterOrders('กำลังทำ',this)">🟡 กำลังทำ</button>
  <button class="tab" data-filter="เสร็จแล้ว" onclick="filterOrders('เสร็จแล้ว',this)">🟢 เสร็จ</button>
  <button class="tab" data-filter="ส่งแล้ว" onclick="filterOrders('ส่งแล้ว',this)">✅ ส่งแล้ว</button>
  <button class="tab" data-filter="ยกเลิก" onclick="filterOrders('ยกเลิก',this)">❌ ยกเลิก</button>
</div>

<!-- Orders List -->
<div class="orders-wrap" id="orders-container">
  <div class="empty"><div class="empty-icon">📋</div><div class="empty-text">ยังไม่มีออเดอร์</div></div>
</div>

<script>
// ══════════════════════════════════════════
//  🔧 ตั้งค่า — แก้ URL นี้
// ══════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcofPuwLMYxCMgPbOnbkA0FyTRzzMo8r-Z9j0H2Eq_KcY--iuMV9RRD74KMbWyPgvmhA/exec';
// ══════════════════════════════════════════

let allOrders   = [];
let activeFilter = 'all';
let refreshTimer = null;

// ── Load Orders ──────────────────────────
async function loadOrders() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=orders');
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message);
    allOrders = data.orders || [];
    renderOrders();
    updateSummary();
    const now = new Date();
    document.getElementById('last-update').textContent =
      'อัปเดต ' + now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0') + ' น.';
  } catch (err) {
    showToast('❌ โหลดไม่ได้: ' + err.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── Render ───────────────────────────────
function renderOrders() {
  const container = document.getElementById('orders-container');
  const filtered  = activeFilter === 'all'
    ? allOrders
    : allOrders.filter(o => o.status === activeFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>
      <div class="empty-text">${activeFilter === 'all' ? 'ยังไม่มีออเดอร์' : 'ไม่มีออเดอร์สถานะนี้'}</div></div>`;
    return;
  }

  container.innerHTML = filtered.map(o => orderCard(o)).join('');
}

function orderCard(o) {
  const typeClass = o.type === 'ส่ง' ? 'type-ส่ง' : 'type-รับหน้าร้าน';
  const typeIcon  = o.type === 'ส่ง' ? '🛵 ส่ง' : '🏪 รับหน้าร้าน';
  const noteHtml  = o.note    ? `<div class="order-note">📝 ${o.note}</div>` : '';
  const addrHtml  = o.address ? `<div class="order-address">📍 ${o.address}</div>` : '';
  const actions   = getActions(o.status, o.orderNum);

  return `
  <div class="order-card" id="card-${o.orderNum.replace('#','')}">
    <div class="card-header">
      <div>
        <div class="order-num">${o.orderNum}</div>
        <div class="order-time">${o.date} เวลา ${o.time} น.</div>
      </div>
      <span class="status-badge badge-${o.status}">${o.status}</span>
    </div>
    <div class="card-body">
      <div class="order-customer">
        👤 ${o.customerName}
        <span class="type-tag ${typeClass}">${typeIcon}</span>
      </div>
      <div class="order-items">🍽️ ${o.items}</div>
      ${noteHtml}${addrHtml}
      <div class="order-total">💰 ฿${Number(o.total).toLocaleString()}</div>
    </div>
    ${actions ? `<div class="card-actions">${actions}</div>` : ''}
  </div>`;
}

function getActions(status, orderNum) {
  const q = JSON.stringify(orderNum);
  const actions = {
    'รอทำ':      `<button class="action-btn btn-confirm" onclick="updateStatus(${q},'รับออเดอร์')">✅ รับออเดอร์</button>
                  <button class="action-btn btn-cancel"  onclick="updateStatus(${q},'ยกเลิก')">❌ ยกเลิก</button>`,
    'รับออเดอร์': `<button class="action-btn btn-cooking" onclick="updateStatus(${q},'กำลังทำ')">👨‍🍳 เริ่มทำ</button>
                  <button class="action-btn btn-cancel"  onclick="updateStatus(${q},'ยกเลิก')">❌ ยกเลิก</button>`,
    'กำลังทำ':   `<button class="action-btn btn-done"    onclick="updateStatus(${q},'เสร็จแล้ว')">🎉 ทำเสร็จ</button>`,
    'เสร็จแล้ว': `<button class="action-btn btn-deliver" onclick="updateStatus(${q},'ส่งแล้ว')">🛵 ส่งแล้ว / รับแล้ว</button>`,
  };
  return actions[status] || '';
}

// ── Update Status ─────────────────────────
async function updateStatus(orderNum, newStatus) {
  showToast('⏳ กำลังอัปเดต...');
  try {
    const res  = await fetch(APPS_SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify({ action: 'updateOrderStatus', orderNum, status: newStatus }),
      redirect:'follow',
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if (data.status !== 'success') throw new Error(data.message);

    // อัปเดต local
    const idx = allOrders.findIndex(o => o.orderNum === orderNum);
    if (idx !== -1) allOrders[idx].status = newStatus;
    renderOrders();
    updateSummary();
    showToast('✅ อัปเดตสถานะแล้ว: ' + newStatus);
  } catch (err) {
    showToast('❌ ' + err.message);
  }
}

// ── Filter ───────────────────────────────
function filterOrders(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

// ── Summary ──────────────────────────────
function updateSummary() {
  const today = new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});
  // นับเฉพาะวันนี้
  const todayOrders = allOrders.filter(o => {
    const d = typeof o.date === 'object' ? o.date.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) : String(o.date);
    return true; // นับทั้งหมดถ้า format ต่างกัน
  });
  document.getElementById('cnt-new').textContent   = allOrders.filter(o => o.status === 'รอทำ').length;
  document.getElementById('cnt-doing').textContent = allOrders.filter(o => o.status === 'กำลังทำ' || o.status === 'รับออเดอร์').length;
  document.getElementById('cnt-done').textContent  = allOrders.filter(o => o.status === 'เสร็จแล้ว' || o.status === 'ส่งแล้ว').length;
  document.getElementById('cnt-all').textContent   = allOrders.length;
}

// ── Toast ────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Auto Refresh ──────────────────────────
function startAutoRefresh() {
  refreshTimer = setInterval(() => {
    loadOrders();
  }, 30000); // 30 วินาที
}

// ── Init ──────────────────────────────────
loadOrders();
startAutoRefresh();
</script>
</body>
</html>
