<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>หลังบ้าน — ครัวพอใจ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--red:#dc2626;
  --orange:#ea580c;--gray:#64748b;--bg:#f1f5f9;--card:#fff;
  --text:#1e293b;--text2:#64748b;--border:#e2e8f0;
}
body{font-family:'Sarabun','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px;}

/* ── Login Screen ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--blue),var(--blue2));z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-logo{font-size:48px;margin-bottom:8px;}
.login-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:4px;}
.login-sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:32px;}
.pin-dots{display:flex;gap:14px;margin-bottom:32px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:transparent;transition:.15s;}
.pin-dot.filled{background:#fff;border-color:#fff;}
.pin-dot.error{background:#ef4444;border-color:#ef4444;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px;}
.pin-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;font-weight:600;padding:18px;border-radius:16px;cursor:pointer;font-family:inherit;transition:.1s;-webkit-tap-highlight-color:rgba(255,255,255,.2);}
.pin-btn:active{background:rgba(255,255,255,.3);transform:scale(.95);}
.pin-btn.del{font-size:18px;}
.pin-error{color:#fca5a5;font-size:13px;margin-top:12px;min-height:20px;text-align:center;}

/* ── Header ── */
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:14px 16px;color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:17px;font-weight:700;}
.header-sub{font-size:11px;opacity:.8;margin-top:2px;}
.refresh-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;}

/* ── Bottom Nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:60;height:60px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;font-family:inherit;font-size:11px;color:var(--text2);cursor:pointer;padding:6px 0;}
.nav-btn.active{color:var(--blue);}
.nav-btn .nav-icon{font-size:20px;line-height:1;}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;position:absolute;top:6px;right:calc(50% - 18px);}
.nav-btn{position:relative;}

/* ── Pages ── */
.page{display:none;}
.page.active{display:block;}

/* ── Summary Bar ── */
.summary{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
.summary::-webkit-scrollbar{display:none;}
.sum-card{flex:0 0 auto;background:var(--card);border-radius:12px;padding:10px 14px;min-width:90px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.sum-num{font-size:22px;font-weight:800;}
.sum-label{font-size:11px;color:var(--text2);margin-top:2px;}
.sum-card.new .sum-num{color:var(--orange);}
.sum-card.doing .sum-num{color:var(--blue);}
.sum-card.done .sum-num{color:var(--green);}

/* ── Filter Tabs ── */
.filter-wrap{padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filter-wrap::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:7px 16px;border-radius:20px;font-size:13px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-family:inherit;}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ── Order Cards ── */
.orders-wrap{padding:0 16px;}
.order-card{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card-header{padding:12px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.order-num{font-size:16px;font-weight:800;color:var(--blue);}
.order-time{font-size:11px;color:var(--text2);margin-top:2px;}
.status-badge{flex:0 0 auto;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-รอทำ{background:#fff7ed;color:#c2410c;}
.badge-รับออเดอร์{background:#eff6ff;color:#1d4ed8;}
.badge-กำลังทำ{background:#fef3c7;color:#b45309;}
.badge-เสร็จแล้ว{background:#f0fdf4;color:#15803d;}
.badge-ส่งแล้ว{background:#f0fdf4;color:#15803d;}
.badge-ยกเลิก{background:#fef2f2;color:#991b1b;}
.card-body{padding:0 14px 12px;}
.order-customer{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.type-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
.type-ส่ง{background:#ede9fe;color:#6d28d9;}
.type-รับหน้าร้าน{background:#ecfdf5;color:#065f46;}
.order-items{font-size:16px;color:var(--text);font-weight:600;line-height:1.5;margin-bottom:6px;}
.order-note{font-size:12px;color:var(--orange);margin-bottom:4px;}
.order-address{font-size:12px;color:var(--text2);margin-bottom:6px;}
.order-total{font-size:15px;font-weight:700;color:var(--blue);}
.card-actions{padding:10px 14px 14px;display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{flex:1;min-width:100px;padding:10px 8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.action-btn:active{opacity:.7;transform:scale(.97);}
.btn-confirm{background:#dbeafe;color:#1d4ed8;}
.btn-cooking{background:#fef3c7;color:#b45309;}
.btn-done{background:#dcfce7;color:#15803d;}
.btn-deliver{background:#d1fae5;color:#065f46;}
.btn-cancel{background:#fee2e2;color:#991b1b;}

/* ── Menu Page ── */
.menu-search{padding:12px 16px 0;}
.search-input{width:100%;padding:10px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
.search-input:focus{border-color:var(--blue);}

.menu-list{padding:12px 16px;}
.menu-item{background:var(--card);border-radius:14px;margin-bottom:10px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.menu-emoji{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;flex:0 0 auto;}
.menu-info{flex:1;min-width:0;}
.menu-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.menu-cat{font-size:11px;color:var(--text2);}
.menu-price{font-size:13px;font-weight:600;color:var(--blue);margin-top:2px;}
.menu-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}

/* Toggle Switch */
.toggle{position:relative;width:44px;height:24px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;cursor:pointer;transition:.2s;}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked + .toggle-slider{background:var(--green);}
.toggle input:checked + .toggle-slider:before{transform:translateX(20px);}

.edit-btn{background:var(--bg);border:none;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--blue);}
.del-btn{background:#fee2e2;border:none;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--red);}

/* ── FAB ── */
.fab{position:fixed;bottom:76px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;z-index:55;}
.fab:active{transform:scale(.93);}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:24px 20px 36px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
.form-input:focus{border-color:var(--blue);}
.form-select{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-save{background:var(--blue);color:#fff;}
.btn-close{background:var(--bg);color:var(--text2);}

/* ── Empty / Loading ── */
.empty{text-align:center;padding:60px 20px;color:var(--text2);}
.empty-icon{font-size:48px;margin-bottom:12px;}
#loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px;}
#loading .spin{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.auto-bar{background:#eff6ff;text-align:center;font-size:11px;color:var(--blue);padding:4px;}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-logo">🍳</div>
  <div class="login-title">ครัวพอใจ — หลังบ้าน</div>
  <div class="login-sub">กรอก PIN 4 หลักเพื่อเข้าใช้งาน</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn" onclick="pinPress('')"></button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn del" onclick="pinDel()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<div id="loading"><div class="spin"></div><span>กำลังโหลด...</span></div>
<div class="toast" id="toast"></div>

<!-- Header -->
<div class="header">
  <div>
    <div class="header-title">🍽️ ครัวพอใจ — หลังบ้าน</div>
    <div class="header-sub" id="last-update">กำลังโหลด...</div>
  </div>
  <button class="refresh-btn" onclick="refreshCurrent()">🔄</button>
</div>
<div class="auto-bar">รีเฟรชอัตโนมัติทุก 30 วินาที</div>

<!-- ════ PAGE: ORDERS ════ -->
<div class="page active" id="page-orders">
  <div class="summary">
    <div class="sum-card new"><div class="sum-num" id="cnt-new">0</div><div class="sum-label">รอทำ</div></div>
    <div class="sum-card doing"><div class="sum-num" id="cnt-doing">0</div><div class="sum-label">กำลังทำ</div></div>
    <div class="sum-card done"><div class="sum-num" id="cnt-done">0</div><div class="sum-label">เสร็จ/ส่ง</div></div>
    <div class="sum-card" style="background:#f8fafc"><div class="sum-num" id="cnt-all" style="color:#475569">0</div><div class="sum-label">ทั้งหมด</div></div>
  </div>
  <div class="filter-wrap">
    <button class="tab active" onclick="filterOrders('all',this)">ทั้งหมด</button>
    <button class="tab" onclick="filterOrders('รอทำ',this)">🔴 รอทำ</button>
    <button class="tab" onclick="filterOrders('รับออเดอร์',this)">🔵 รับแล้ว</button>
    <button class="tab" onclick="filterOrders('กำลังทำ',this)">🟡 กำลังทำ</button>
    <button class="tab" onclick="filterOrders('เสร็จแล้ว',this)">🟢 เสร็จ</button>
    <button class="tab" onclick="filterOrders('ส่งแล้ว',this)">✅ ส่งแล้ว</button>
    <button class="tab" onclick="filterOrders('ยกเลิก',this)">❌ ยกเลิก</button>
  </div>
  <div class="orders-wrap" id="orders-container">
    <div class="empty"><div class="empty-icon">📋</div><div>ยังไม่มีออเดอร์</div></div>
  </div>
</div>

<!-- ════ PAGE: MENU ════ -->
<div class="page" id="page-menu">
  <div class="menu-search">
    <input class="search-input" type="text" placeholder="🔍 ค้นหาเมนู..." oninput="filterMenu(this.value)">
  </div>
  <div class="filter-wrap" style="margin-top:10px;">
    <button class="tab active" onclick="filterMenuCat('all',this)">ทั้งหมด</button>
    <button class="tab" onclick="filterMenuCat('ผัด',this)">🥘 ผัด</button>
    <button class="tab" onclick="filterMenuCat('ข้าว',this)">🍚 ข้าว</button>
    <button class="tab" onclick="filterMenuCat('ก๋วยเตี๋ยว',this)">🍜 เส้น</button>
    <button class="tab" onclick="filterMenuCat('ต้ม/แกง',this)">🍲 ต้ม/แกง</button>
    <button class="tab" onclick="filterMenuCat('เครื่องดื่ม',this)">🥤 เครื่องดื่ม</button>
  </div>
  <div class="menu-list" id="menu-container">
    <div class="empty"><div class="empty-icon">🍽️</div><div>ยังไม่มีเมนู</div></div>
  </div>
</div>

<!-- FAB Add Menu (แสดงเฉพาะหน้าเมนู) -->
<button class="fab" id="fab-add" style="display:none" onclick="openAddModal()">＋</button>

<!-- ════ MODAL: Add / Edit Menu ════ -->
<div class="modal-overlay" id="menu-modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">➕ เพิ่มเมนูใหม่</div>
    <input type="hidden" id="edit-row">
    <div class="form-group">
      <label class="form-label">ชื่อเมนู *</label>
      <input class="form-input" id="f-name" type="text" placeholder="เช่น ผัดกระเพราหมูกรอบ">
    </div>
    <div class="form-group">
      <label class="form-label">หมวดหมู่ *</label>
      <select class="form-select" id="f-cat">
        <option value="ผัด">🥘 ผัด</option>
        <option value="ข้าว">🍚 ข้าว</option>
        <option value="ก๋วยเตี๋ยว">🍜 ก๋วยเตี๋ยว</option>
        <option value="ต้ม/แกง">🍲 ต้ม/แกง</option>
        <option value="เครื่องดื่ม">🥤 เครื่องดื่ม</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">ราคา (฿) *</label>
      <input class="form-input" id="f-price" type="number" placeholder="60" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">ต้นทุน (฿)</label>
      <input class="form-input" id="f-cost" type="number" placeholder="0" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">Add-ons (คั่นด้วยจุลภาค)</label>
      <input class="form-input" id="f-addons" type="text" placeholder="พิเศษ, ไข่ดาว, ไข่ชัน">
    </div>
    <div class="form-group">
      <label class="form-label">สถานะ</label>
      <select class="form-select" id="f-status">
        <option value="มี">✅ มีสินค้า</option>
        <option value="หมด">❌ หมด</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="modal-btn btn-close" onclick="closeMenuModal()">ยกเลิก</button>
      <button class="modal-btn btn-save" onclick="saveMenu()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-orders" onclick="showPage('orders')">
    <span class="nav-icon">📋</span>
    <span>ออเดอร์</span>
    <span class="nav-badge" id="badge-orders" style="display:none">0</span>
  </button>
  <button class="nav-btn" id="nav-menu" onclick="showPage('menu')">
    <span class="nav-icon">🍽️</span>
    <span>จัดการเมนู</span>
  </button>
</nav>

<script>
// ══════════════════════════════════════════
//  🔧 ตั้งค่า URL
// ══════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-_hcz2P3IXtrJdmph_MdodAY-AIym34bV9isYtgTJIq3f3VHi2z4-3l0A5yRq-21SFg/exec';

// ══════════════════════════════════════════
//  🔐 PIN — เปลี่ยนรหัสที่นี่
// ══════════════════════════════════════════
const ADMIN_PIN = '8668';   // ← เปลี่ยน PIN ได้ที่นี่

let pinInput = '';

function pinPress(n) {
  if (!n) return;
  if (pinInput.length >= 4) return;
  pinInput += n;
  updateDots();
  if (pinInput.length === 4) setTimeout(checkPin, 150);
}
function pinDel() {
  pinInput = pinInput.slice(0, -1);
  document.getElementById('pin-error').textContent = '';
  updateDots(false);
}
function updateDots(err) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.classList.toggle('filled', i < pinInput.length);
    d.classList.toggle('error', !!err);
  }
}
function checkPin() {
  if (pinInput === ADMIN_PIN) {
    sessionStorage.setItem('kpj_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    initApp();
  } else {
    document.getElementById('pin-error').textContent = '❌ PIN ไม่ถูกต้อง กรุณาลองใหม่';
    updateDots(true);
    setTimeout(() => { pinInput = ''; updateDots(false); }, 800);
  }
}

function initApp() {
  setInterval(loadOrders, 30000);
  loadOrders();
}

// ตรวจสอบ session ที่ login แล้ว (script อยู่ท้าย body — DOM พร้อมแล้ว)
if (sessionStorage.getItem('kpj_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  initApp();
}
// ถ้ายังไม่ login: login-screen แสดงอยู่แล้วจาก CSS (z-index:9999 ทับทุกอย่าง)

let allOrders   = [];
let allMenus    = [];
let activeOrderFilter = 'all';
let activeMenuCat     = 'all';
let menuSearchQ       = '';
let currentPage       = 'orders';

// ════════════════════════════════════════
//  PAGE NAVIGATION
// ════════════════════════════════════════
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  document.getElementById('fab-add').style.display = page === 'menu' ? 'flex' : 'none';
  if (page === 'menu' && allMenus.length === 0) loadMenus();
}

function refreshCurrent() {
  if (currentPage === 'orders') loadOrders();
  else loadMenus();
}

// ════════════════════════════════════════
//  ORDERS
// ════════════════════════════════════════
async function loadOrders() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=orders');
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message);
    allOrders = data.orders || [];
    renderOrders();
    updateSummary();
    const now = new Date();
    document.getElementById('last-update').textContent =
      'อัปเดต ' + now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0') + ' น.';
  } catch(err) { showToast('❌ โหลดออเดอร์ไม่ได้: ' + err.message); }
  finally { document.getElementById('loading').style.display = 'none'; }
}

function renderOrders() {
  const c = document.getElementById('orders-container');
  const list = activeOrderFilter === 'all' ? allOrders : allOrders.filter(o => o.status === activeOrderFilter);
  if (!list.length) { c.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div>${activeOrderFilter==='all'?'ยังไม่มีออเดอร์':'ไม่มีออเดอร์สถานะนี้'}</div></div>`; return; }
  c.innerHTML = list.map(orderCard).join('');
}

function fmtDate(val) {
  if (!val) return '-';
  const s = String(val);
  if (s.includes('T')) {
    const d = new Date(s);
    if (isNaN(d)) return s;
    const dd = String(d.getUTCDate()).padStart(2,'0');
    const mm = String(d.getUTCMonth()+1).padStart(2,'0');
    const yy = d.getUTCFullYear();
    return dd+'/'+mm+'/'+yy;
  }
  return s;
}
function fmtTime(val) {
  if (!val) return '-';
  const s = String(val);
  if (s.includes('T')) {
    const d = new Date(s);
    if (isNaN(d)) return s;
    const hh = String(d.getUTCHours()).padStart(2,'0');
    const mi = String(d.getUTCMinutes()).padStart(2,'0');
    return hh+':'+mi;
  }
  return s;
}

function orderCard(o) {
  const typeClass = o.type === 'ส่ง' ? 'type-ส่ง' : 'type-รับหน้าร้าน';
  const typeIcon  = o.type === 'ส่ง' ? '🛵 ส่ง' : '🏪 รับหน้าร้าน';
  const note    = o.note    ? `<div class="order-note">📝 ${o.note}</div>` : '';
  const address = o.address ? `<div class="order-address">📍 ${o.address}</div>` : '';
  const safeNum = o.orderNum.replace(/'/g, "\\'");
  return `<div class="order-card">
    <div class="card-header">
      <div><div class="order-num">${o.orderNum}</div><div class="order-time">${fmtDate(o.date)} เวลา ${fmtTime(o.time)} น.</div></div>
      <span class="status-badge badge-${o.status}">${o.status}</span>
    </div>
    <div class="card-body">
      <div class="order-customer">👤 ${o.customerName}<span class="type-tag ${typeClass}">${typeIcon}</span></div>
      <div class="order-items">🍽️ ${o.items}</div>
      ${note}${address}
      <div class="order-total">💰 ฿${Number(o.total).toLocaleString()}</div>
    </div>
    ${getActions(o.status, safeNum) ? `<div class="card-actions">${getActions(o.status, safeNum)}</div>` : ''}
  </div>`;
}

function getActions(status, num) {
  const map = {
    'รอทำ':      `<button class="action-btn btn-confirm" onclick="updateStatus('${num}','รับออเดอร์')">✅ รับออเดอร์</button><button class="action-btn btn-cancel" onclick="updateStatus('${num}','ยกเลิก')">❌ ยกเลิก</button>`,
    'รับออเดอร์': `<button class="action-btn btn-cooking" onclick="updateStatus('${num}','กำลังทำ')">👨‍🍳 เริ่มทำ</button><button class="action-btn btn-cancel" onclick="updateStatus('${num}','ยกเลิก')">❌ ยกเลิก</button>`,
    'กำลังทำ':   `<button class="action-btn btn-done" onclick="updateStatus('${num}','เสร็จแล้ว')">🎉 ทำเสร็จ</button>`,
    'เสร็จแล้ว': `<button class="action-btn btn-deliver" onclick="updateStatus('${num}','ส่งแล้ว')">🛵 ส่งแล้ว / รับแล้ว</button>`,
  };
  return map[status] || '';
}

async function updateStatus(orderNum, newStatus) {
  showToast('⏳ กำลังอัปเดต...');
  try {
    const res  = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'updateOrderStatus',orderNum,status:newStatus}), redirect:'follow' });
    const data = JSON.parse(await res.text());
    if (data.status !== 'success') throw new Error(data.message);
    const idx = allOrders.findIndex(o => o.orderNum === orderNum);
    if (idx !== -1) allOrders[idx].status = newStatus;
    renderOrders(); updateSummary();
    showToast('✅ ' + newStatus + ' แล้ว');
  } catch(err) { showToast('❌ ' + err.message); }
}

function filterOrders(f, btn) {
  activeOrderFilter = f;
  document.querySelectorAll('#page-orders .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function updateSummary() {
  const pending = allOrders.filter(o => o.status === 'รอทำ').length;
  document.getElementById('cnt-new').textContent   = pending;
  document.getElementById('cnt-doing').textContent = allOrders.filter(o => o.status==='กำลังทำ'||o.status==='รับออเดอร์').length;
  document.getElementById('cnt-done').textContent  = allOrders.filter(o => o.status==='เสร็จแล้ว'||o.status==='ส่งแล้ว').length;
  document.getElementById('cnt-all').textContent   = allOrders.length;
  const badge = document.getElementById('badge-orders');
  badge.textContent = pending;
  badge.style.display = pending > 0 ? 'block' : 'none';
}

// ════════════════════════════════════════
//  MENU MANAGEMENT
// ════════════════════════════════════════
const EMOJI_MAP = {'ผัด':'🥘','ข้าว':'🍚','ก๋วยเตี๋ยว':'🍜','ต้ม/แกง':'🍲','เครื่องดื่ม':'🥤'};

async function loadMenus() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=adminMenu');
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message);
    allMenus = data.items || [];
    renderMenus();
  } catch(err) { showToast('❌ โหลดเมนูไม่ได้: ' + err.message); }
}

function renderMenus() {
  const c = document.getElementById('menu-container');
  let list = allMenus;
  if (activeMenuCat !== 'all') list = list.filter(m => m.category === activeMenuCat);
  if (menuSearchQ) list = list.filter(m => m.name.includes(menuSearchQ));
  if (!list.length) { c.innerHTML = `<div class="empty"><div class="empty-icon">🍽️</div><div>ไม่พบเมนู</div></div>`; return; }
  c.innerHTML = list.map(menuCard).join('');
}

function menuCard(m) {
  const emoji = EMOJI_MAP[m.category] || '🍽️';
  const checked = m.status === 'มี' ? 'checked' : '';
  return `<div class="menu-item">
    <div class="menu-emoji">${emoji}</div>
    <div class="menu-info">
      <div class="menu-name">${m.name}</div>
      <div class="menu-cat">${m.category} • ${m.id}</div>
      <div class="menu-price">฿${m.price}</div>
    </div>
    <div class="menu-actions">
      <label class="toggle" title="${m.status === 'มี' ? 'มีสินค้า' : 'หมด'}">
        <input type="checkbox" ${checked} onchange="toggleStatus('${m.id}',this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <button class="edit-btn" onclick='openEditModal(${JSON.stringify(m)})'>✏️</button>
      <button class="del-btn" onclick="deleteMenu('${m.id}','${m.name}')">🗑️</button>
    </div>
  </div>`;
}

async function toggleStatus(menuId, isOn) {
  const newStatus = isOn ? 'มี' : 'หมด';
  try {
    const res  = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'toggleMenu', menuId, status:newStatus}), redirect:'follow' });
    const data = JSON.parse(await res.text());
    if (data.status !== 'success') throw new Error(data.message);
    const m = allMenus.find(x => x.id === menuId);
    if (m) m.status = newStatus;
    showToast((isOn ? '✅ เปิดเมนู: ' : '🔴 ปิดเมนู: ') + (m ? m.name : menuId));
  } catch(err) { showToast('❌ ' + err.message); loadMenus(); }
}

async function deleteMenu(menuId, name) {
  if (!confirm('ลบเมนู "' + name + '" ใช่ไหม?')) return;
  try {
    const res  = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'deleteMenu', menuId}), redirect:'follow' });
    const data = JSON.parse(await res.text());
    if (data.status !== 'success') throw new Error(data.message);
    allMenus = allMenus.filter(m => m.id !== menuId);
    renderMenus();
    showToast('🗑️ ลบเมนูแล้ว: ' + name);
  } catch(err) { showToast('❌ ' + err.message); }
}

function filterMenuCat(cat, btn) {
  activeMenuCat = cat;
  document.querySelectorAll('#page-menu .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderMenus();
}

function filterMenu(q) { menuSearchQ = q; renderMenus(); }

// ════════════════════════════════════════
//  MODAL: ADD / EDIT MENU
// ════════════════════════════════════════
function openAddModal() {
  document.getElementById('modal-title').textContent = '➕ เพิ่มเมนูใหม่';
  document.getElementById('edit-row').value = '';
  document.getElementById('f-name').value   = '';
  document.getElementById('f-cat').value    = 'ผัด';
  document.getElementById('f-price').value  = '';
  document.getElementById('f-cost').value   = '';
  document.getElementById('f-addons').value = '';
  document.getElementById('f-status').value = 'มี';
  document.getElementById('menu-modal').classList.add('open');
}

function openEditModal(m) {
  document.getElementById('modal-title').textContent = '✏️ แก้ไขเมนู';
  document.getElementById('edit-row').value  = m.id;
  document.getElementById('f-name').value    = m.name;
  document.getElementById('f-cat').value     = m.category;
  document.getElementById('f-price').value   = m.price;
  document.getElementById('f-cost').value    = m.cost || '';
  document.getElementById('f-addons').value  = (m.addons || []).join(', ');
  document.getElementById('f-status').value  = m.status;
  document.getElementById('menu-modal').classList.add('open');
}

function closeMenuModal() { document.getElementById('menu-modal').classList.remove('open'); }
function closeModal(e) { if (e.target === document.getElementById('menu-modal')) closeMenuModal(); }

async function saveMenu() {
  const name   = document.getElementById('f-name').value.trim();
  const cat    = document.getElementById('f-cat').value;
  const price  = Number(document.getElementById('f-price').value);
  const cost   = Number(document.getElementById('f-cost').value) || 0;
  const addons = document.getElementById('f-addons').value.trim();
  const status = document.getElementById('f-status').value;
  const editId = document.getElementById('edit-row').value;

  if (!name || !price) { showToast('❌ กรุณากรอกชื่อและราคา'); return; }

  const action = editId ? 'updateMenu' : 'addMenu';
  const payload = { action, name, category: cat, price, cost, addons, status };
  if (editId) payload.menuId = editId;

  showToast('⏳ กำลังบันทึก...');
  try {
    const res  = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload), redirect:'follow' });
    const data = JSON.parse(await res.text());
    if (data.status !== 'success') throw new Error(data.message);
    closeMenuModal();
    await loadMenus();
    showToast(editId ? '✅ แก้ไขเมนูแล้ว' : '✅ เพิ่มเมนูแล้ว: ' + name);
  } catch(err) { showToast('❌ ' + err.message); }
}

// ════════════════════════════════════════
//  TOAST & AUTO REFRESH
// ════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2500);
}

// โหลดครั้งแรกจัดการโดย initApp() (หลัง PIN ผ่าน)
</script>
